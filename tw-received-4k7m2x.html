<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Thank you | T.W Residence</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--wine:#8B6B2E;--wine-deep:#3B2A1C;--cream:#FBF3E7;--brass:#C9A24D;--ink:#3B2A1C;--ink-soft:#786349;--line:#E6D9C2;}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Public Sans',sans-serif;color:var(--ink);line-height:1.6;min-height:100vh;-webkit-font-smoothing:antialiased;
    background:linear-gradient(180deg,rgba(59,42,28,.55),rgba(42,30,18,.88)),url('images/hero.jpg') center/cover fixed no-repeat,var(--wine-deep);
    display:flex;flex-direction:column;align-items:center;padding:28px 18px 24px;justify-content:center}
  .brand{font-family:'Fraunces',serif;font-size:22px;color:#fff;letter-spacing:.02em;margin:0 0 18px;text-align:center}
  .brand small{display:block;font-family:'Public Sans',sans-serif;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--brass);margin-top:2px}
  .card{background:var(--cream);max-width:400px;width:100%;padding:34px 26px 26px;text-align:center;border-top:4px solid var(--brass);box-shadow:0 24px 60px rgba(0,0,0,.35)}
  .tick{width:56px;height:56px;border-radius:50%;background:var(--wine);margin:-62px auto 16px;display:flex;align-items:center;justify-content:center;color:var(--cream);border:5px solid var(--cream);box-shadow:0 0 0 1px var(--brass)}
  .eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--wine);font-weight:600;margin:0 0 10px}
  h1{font-family:'Fraunces',serif;font-weight:500;font-size:28px;line-height:1.15;margin:4px 0 14px;color:var(--wine-deep)}
  h1 em{color:var(--wine)}
  .lead{margin:0 auto;color:var(--ink-soft);max-width:340px;font-size:15px}
  .rule{width:56px;height:2px;background:var(--brass);margin:26px auto}
  .steps{text-align:left;display:flex;flex-direction:column;gap:16px;margin:0 0 30px}
  .step{display:flex;gap:14px;align-items:flex-start}
  .num{flex:0 0 30px;height:30px;border-radius:50%;border:1px solid var(--brass);color:var(--wine);font-family:'Fraunces',serif;font-size:15px;display:flex;align-items:center;justify-content:center;margin-top:1px}
  .step p{margin:0;font-size:15px;color:var(--ink)}
  .step strong{font-weight:600}
  .btn{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--wine);color:var(--cream);padding:16px 24px;font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;border:1px solid var(--wine)}
  .btn:hover{background:var(--wine-deep)}
  .back{display:inline-block;margin-top:20px;font-size:14px;color:var(--ink-soft);text-decoration:none;border-bottom:1px solid var(--line)}
  .tag{margin-top:24px;font-family:'Fraunces',serif;font-style:italic;color:#EFE1E0;font-size:17px;text-align:center}
</style>
</head>
<body>
  <div class="brand">T.W Residence<small>Surulere, Lagos</small></div>
  <div style="height:30px"></div>
  <div class="card">
    <div class="tick"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 12.5l5 5L19.5 7"/></svg></div>
    <h1>Thank you for <em>choosing us</em></h1>
    <p class="lead">Your payment has been received. We're delighted to host you, and your confirmation is on its way to your email. Should you need anything before you arrive, we're a message away.</p>
    <a class="back" href="https://wa.me/2348123331112" target="_blank" rel="noopener">Message us on WhatsApp</a>
  </div>
  <div class="tag">Home away from home</div>
</body>
</html>
