<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>T.W Residence — TEST booking site</title>
<style>
  body{margin:0;background:#F7F3EB;color:#3B291B;font-family:Georgia,'Times New Roman',serif;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:24px;box-sizing:border-box;}
  .box{max-width:420px;}
  h1{font-size:22px;font-weight:normal;letter-spacing:.02em;}
  p{font-size:15px;line-height:1.6;color:#6b5844;}
  .tag{display:inline-block;background:#6E202E;color:#F7F3EB;font-family:Arial,sans-serif;font-size:11px;font-weight:700;letter-spacing:.14em;padding:5px 10px;border-radius:3px;margin-bottom:14px;}
</style>
</head>
<body>
<div class="box">
  <div class="tag">TEST SITE</div>
  <h1>T.W Residence — test booking</h1>
  <p id="mock-msg">Loading the test site…</p>
  <p>Bookings and payments here are simulated. No real booking is made and no money is taken.</p>
</div>
<script>
(function(){
  var BOOTSTRAP = `/* T.W Residence TEST-SITE bootstrap: makes the real page run fully simulated.
   No real booking is created, no real payment is taken, nothing is sent to
   the live booking service, Formspree, Web3Forms or the Sheets backup. */
(function(){
  var MOCK_API = 'https://mock-api.twresidence.test';
  window.TW_CONFIG = { apiUrl: MOCK_API };
  var state = { booking: null, paid: false };
  function fmtN(n){ return '\u20A6' + n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  /* Pricing replicated from index.html (19 Nov 2026 rules) so the mock
     confirmation shows the same total the live server would compute. */
  var SEASONAL = [ ['2026-11-01','2026-12-14',230000], ['2026-12-15','2027-01-02',250000], ['2027-01-03','2027-01-05',250000], ['2027-01-06','2027-01-21',250000], ['2027-02-10','2027-02-16',250000], ['2027-03-07','2027-03-13',250000], ['2027-03-24','2027-03-29',250000], ['2027-04-29','2027-05-02',250000], ['2027-05-14','2027-05-19',250000], ['2027-06-11','2027-06-13',250000], ['2027-08-13','2027-08-15',250000], ['2027-09-30','2027-10-02',250000] ];
  function basePrice(ds){ for (var i = 0; i < SEASONAL.length; i++){ if (ds >= SEASONAL[i][0] && ds <= SEASONAL[i][1]) return SEASONAL[i][2]; } return 200000; }
  function priceFor(ds){ var b = basePrice(ds); if (b === 200000){ var day = new Date(ds + 'T12:00:00Z').getUTCDay(); if (day >= 1 && day <= 4) return 180000; } return b; }
  function quote(ci, co){
    var start = new Date(ci), end = new Date(co);
    var nights = Math.round((end - start) / 86400000);
    if (!ci || !co || nights <= 0) return { nights: 0, rent: 0, total: 100000 };
    var total = 0, prices = [], dates = [], i, d, ds, p;
    for (i = 0; i < nights; i++){ d = new Date(start); d.setDate(d.getDate() + i); ds = d.toISOString().split('T')[0]; dates.push(ds); p = priceFor(ds); prices.push(p); total += p; }
    var pct = nights >= 28 ? 25 : nights >= 14 ? 15 : nights >= 7 ? 10 : 0;
    var hasPeak = false;
    prices.forEach(function(pr, ix){ if (pr >= 250000 && dates[ix] <= '2027-01-21') hasPeak = true; });
    if (hasPeak) pct = Math.min(pct, 15);
    if (pct > 0){ var dsum = 0; prices.forEach(function(pr, ix){ if (pr >= 230000 && dates[ix] <= '2027-01-21') dsum += pr; }); total -= Math.round(dsum * pct / 100); }
    return { nights: nights, rent: total, total: total + 100000 };
  }
  /* ---- network: everything booking-related is answered locally ---- */
  var realFetch = window.fetch.bind(window);
  function jsonRes(obj, status){ return new Response(JSON.stringify(obj), { status: status || 200, headers: { 'Content-Type': 'application/json' } }); }
  window.fetch = function(input, init){
    var url = (typeof input === 'string') ? input : ((input && input.url) || '');
    if (url.indexOf(MOCK_API) === 0){
      if (url.indexOf('/api/availability') !== -1) return Promise.resolve(jsonRes({ '1': [], '2': [] }));
      if (url.indexOf('/api/bookings') !== -1 && init && (init.method || '').toUpperCase() === 'POST'){
        var payload = {}; try { payload = JSON.parse(init.body || '{}'); } catch(e){}
        var q = quote(payload.check_in, payload.check_out);
        var ref = 'TW-TEST-' + Math.random().toString(36).slice(2, 8).toUpperCase();
        state.booking = { payload: payload, quote: q, reference: ref };
        state.paid = false;
        return Promise.resolve(jsonRes({ reference: ref, access_code: 'mock_access_code', hold_expires_at: new Date(Date.now() + 20 * 60000).toISOString() }, 201));
      }
      if (url.indexOf('/api/bookings/') !== -1){
        if (!state.booking || !state.paid) return Promise.resolve(jsonRes({ confirmed: false, status: 'held' }));
        var p = state.booking.payload, qq = state.booking.quote;
        return Promise.resolve(jsonRes({ confirmed: true, reference: state.booking.reference, guest_first_name: (p.name || '').split(' ')[0], apartment: p.unit === 2 ? 'Unit 2' : 'Unit 1', check_in: p.check_in, check_out: p.check_out, nights: qq.nights, guests: p.guests, total_naira: qq.total, caution_naira: 100000, payment_status: 'Paid \u2014 TEST (no real charge)', check_in_time: '3:00 PM', check_out_time: '11:00 AM' }));
      }
      return Promise.resolve(jsonRes({}));
    }
    if (url.indexOf('googleapis.com/calendar') !== -1) return Promise.resolve(jsonRes({ items: [] }));
    if (url.indexOf('api.web3forms.com') !== -1 || url.indexOf('formspree.io') !== -1 || url.indexOf('script.google.com') !== -1) return Promise.resolve(jsonRes({ success: true }));
    return realFetch(input, init);
  };
  /* ---- the real Paystack script is never loaded on the test site ---- */
  var origAppendChild = Node.prototype.appendChild;
  Node.prototype.appendChild = function(node){
    if (node && node.tagName === 'SCRIPT' && node.src && node.src.indexOf('paystack.co') !== -1) return node;
    return origAppendChild.call(this, node);
  };
  /* ---- simulated Paystack window ---- */
  function MockPaystackPop(){}
  MockPaystackPop.prototype.resumeTransaction = function(accessCode, handlers){ showMockPayment(handlers || {}); };
  MockPaystackPop.setup = function(){ return { openIframe: function(){ showMockPayment({}); } }; };
  try { Object.defineProperty(window, 'PaystackPop', { configurable: true, get: function(){ return MockPaystackPop; }, set: function(){} }); }
  catch(e){ window.PaystackPop = MockPaystackPop; }
  function el(tag, css, text){ var n = document.createElement(tag); if (css) n.style.cssText = css; if (text != null) n.textContent = text; return n; }
  function field(label, value){
    var wrap = el('div', 'margin-top:12px;');
    wrap.appendChild(el('label', 'display:block;font-size:11px;letter-spacing:.08em;color:#777;text-transform:uppercase;margin-bottom:4px;', label));
    var inp = el('input', 'width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #ddd;border-radius:6px;font-size:15px;color:#222;background:#fafafa;');
    inp.value = value; wrap.appendChild(inp); return wrap;
  }
  function showMockPayment(handlers){
    if (!state.booking) return;
    var total = state.booking.quote.total;
    var overlay = el('div', 'position:fixed;inset:0;background:rgba(20,15,10,.6);z-index:99999;display:flex;align-items:center;justify-content:center;padding:16px;');
    var card = el('div', 'background:#fff;border-radius:14px;max-width:400px;width:100%;padding:22px;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#222;box-shadow:0 20px 60px rgba(0,0,0,.35);max-height:92vh;overflow:auto;');
    var top = el('div', 'display:flex;justify-content:space-between;align-items:flex-start;');
    var brand = el('div', '');
    brand.appendChild(el('div', 'font-weight:700;font-size:16px;', 'T.W Residence'));
    brand.appendChild(el('div', 'font-size:12px;color:#0aa64a;font-weight:600;letter-spacing:.04em;', 'TEST PAYMENT \u2014 SIMULATED PAYSTACK'));
    top.appendChild(brand);
    var x = el('button', 'border:none;background:none;font-size:20px;cursor:pointer;color:#888;line-height:1;', '\u00D7');
    top.appendChild(x); card.appendChild(top);
    card.appendChild(el('div', 'font-size:13px;color:#666;margin-top:6px;', state.booking.payload.email || ''));
    card.appendChild(el('div', 'font-size:26px;font-weight:700;margin-top:8px;', fmtN(total)));
    card.appendChild(field('Card number', '4084 0840 8408 4081'));
    var row = el('div', 'display:flex;gap:10px;');
    var f1 = field('Expiry', '12 / 30'); f1.style.flex = '1';
    var f2 = field('CVV', '408'); f2.style.flex = '1';
    row.appendChild(f1); row.appendChild(f2); card.appendChild(row);
    card.appendChild(el('p', 'font-size:12px;color:#888;line-height:1.5;margin:14px 0 0;', 'This is the test site: the card above is a test card and no real money is taken. The booking is not real either.'));
    var pay = el('button', 'width:100%;margin-top:16px;padding:13px;border:none;border-radius:8px;background:#3bb75e;color:#fff;font-size:16px;font-weight:700;cursor:pointer;', 'Pay ' + fmtN(total));
    card.appendChild(pay);
    var fail = el('button', 'width:100%;margin-top:8px;padding:8px;border:none;background:none;color:#999;font-size:12px;cursor:pointer;text-decoration:underline;', 'Simulate a failed payment instead');
    card.appendChild(fail);
    overlay.appendChild(card); document.body.appendChild(overlay);
    function close(){ if (overlay.parentNode) overlay.parentNode.removeChild(overlay); }
    x.onclick = function(){ close(); if (handlers.onCancel) handlers.onCancel(); };
    fail.onclick = function(){ close(); if (handlers.onError) handlers.onError({ message: 'Simulated failure' }); };
    pay.onclick = function(){
      pay.disabled = true; pay.textContent = 'Processing\u2026'; pay.style.opacity = '0.75';
      setTimeout(function(){ state.paid = true; close(); if (handlers.onSuccess) handlers.onSuccess({ reference: state.booking.reference }); }, 1400);
    };
  }
  /* ---- test banner + title ---- */
  document.addEventListener('DOMContentLoaded', function(){
    document.title = 'TEST \u2014 ' + document.title;
    var style = document.createElement('style');
    style.textContent = '#tw-mock-banner{position:fixed;top:0;left:0;right:0;z-index:99998;background:#6E202E;color:#F7F3EB;font:600 13px/1.4 -apple-system,Segoe UI,Roboto,Arial,sans-serif;text-align:center;padding:9px 12px;} body{padding-top:38px;}';
    document.head.appendChild(style);
    var b = document.createElement('div');
    b.id = 'tw-mock-banner';
    b.textContent = 'TEST SITE \u2014 bookings and payments here are simulated. No real booking is made and no money is taken.';
    document.body.insertBefore(b, document.body.firstChild);
  });
})();`;
  function fail(msg){ var m = document.getElementById('mock-msg'); if (m) m.textContent = msg; }
  fetch('index.html?mock=' + Date.now(), { cache: 'no-store' }).then(function(res){
    if (!res.ok) throw new Error('load');
    return res.text();
  }).then(function(html){
    var before = html;
    html = html.replace('<script src="config.js"><\/script>', '');
    html = html.replace("const TW_GA_ID = 'G-6MJTR80PE8';", "const TW_GA_ID = ''; /* TEST SITE: analytics off */");
    if (html === before) throw new Error('patch');
    var bootTag = '<script>\n' + BOOTSTRAP + '\n</' + 'script>';
    html = html.replace(/<head>/i, '<head>' + bootTag);
    document.open(); document.write(html); document.close();
  }).catch(function(){ fail('The test site could not load just now. Please check your connection and refresh this page.'); });
})();
</script>
</body>
</html>
